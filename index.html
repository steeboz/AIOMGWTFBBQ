<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hidden Bunnies - AIOMGWTFBBQ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="overlay active">
        <div class="modal">
            <h2>AIOMGWTFBBQ Hidden Folks</h2>
            <p>Enter a Username and a 3-Digit PIN to start or resume.</p>
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="pin" placeholder="PIN (3 digits)" maxlength="3" pattern="\d{3}" required>
            <button id="login-btn">Play / Resume</button>
            <p id="login-error" class="error"></p>
        </div>
    </div>

    <!-- Win Screen -->
    <div id="win-screen" class="overlay">
        <div class="modal">
            <h2>Level Complete!</h2>
            <p>You found all the friends and items!</p>
            <p id="final-stats"></p>
            <button id="reset-btn">Play Again</button>
        </div>
    </div>

    <!-- Main Game UI -->
    <div id="game-container">
        <!-- Scene rendered full-bleed on top -->
        <div id="scene-wrapper">
            <!-- New inner wrapper scales correctly with the injected items -->
            <div id="scene-inner">
                <img id="scene-image" src="scene.webp" alt="Hidden Folks Scene">
                <!-- Dynamically injected items go here -->
                <div id="scene-items-container"></div>
                <div id="highlights-container"></div>
            </div>
        </div>
        
        <!-- Find list rendered at the bottom -->
        <div id="ui-bottom">
            <div class="stats-row">
                <span id="counter" class="stat-badge">Found: 0 of 8</span>
                <span id="wrong-counter" class="stat-badge sub-text">Wrong Clicks: 0</span>
                <button id="hint-btn">Use Hint</button>
                <button id="dev-mode-btn">Toggle Dev Mode</button>
            </div>
            
            <div id="dev-panel" style="display:none;">
                <p><strong>Dev Mode Active:</strong> Click image to log coordinates to console.</p>
            </div>

            <!-- Scrollable Item Box -->
            <ul id="find-list"></ul>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
