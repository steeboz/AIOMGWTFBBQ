<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hidden Bunnies - AIOMGWTFBBQ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Login Screen for saving state[cite: 1] -->
    <div id="login-screen" class="overlay active">
        <div class="modal">
            <h2>AIOMGWTFBBQ Hidden Folks</h2>
            <p>Enter a Username and a 3-Digit PIN to start or resume.</p>
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="pin" placeholder="PIN (3 digits)" maxlength="3" pattern="\d{3}" required>
            <button id="login-btn">Play / Resume</button>
            <p id="login-error" class="error"></p>
        </div>
    </div>

    <!-- Win Screen[cite: 1] -->
    <div id="win-screen" class="overlay">
        <div class="modal">
            <h2>Level Complete!</h2>
            <p>You found all the friends and items!</p>
            <p id="final-stats"></p>
            <button id="reset-btn">Play Again</button>
        </div>
    </div>

    <!-- Main Game UI -->
    <div id="game-container">
        <!-- Scene rendered full-bleed on the left[cite: 1] -->
        <div id="scene-wrapper">
            <img id="scene-image" src="scene.webp" alt="Hidden Folks Scene">
            <div id="highlights-container"></div>
        </div>
        
        <!-- Find list on the right[cite: 1] -->
        <div id="ui-sidebar">
            <h3>Find List</h3>
            <p id="counter">Found: 0 of 8</p>
            <p id="wrong-counter" class="sub-text">Wrong Clicks: 0</p>
            <ul id="find-list"></ul>
            <div class="controls">
                <button id="hint-btn">Use Hint</button>
                <button id="dev-mode-btn">Toggle Dev Mode</button>
            </div>
            <div id="dev-panel" style="display:none;">
                <p><strong>Dev Mode Active</strong></p>
                <p>Click image to log coordinates to console.</p>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
