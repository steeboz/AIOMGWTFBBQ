<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CW18 Tracker & Bears Hub | AIOMGWTFBBQ</title>
  <style>
    :root {
      --bg-color: #0b1120;
      --bears-navy: #0b162a;
      --bears-orange: #c83803;
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background: radial-gradient(circle at top left, #1e293b, var(--bg-color)); color: var(--text-main); min-height: 100vh; padding-bottom: 3rem; }
    
    /* Layout */
    .container { max-width: 1200px; margin: 0 auto; padding: 2rem 1rem; }
    header { text-align: center; margin-bottom: 2rem; }
    header h1 { font-size: 2.5rem; font-weight: 900; text-transform: uppercase; color: #fff; }
    header h1 span { color: var(--bears-orange); }
    
    /* Countdown */
    .countdown-banner { background: var(--glass-bg); border: 1px solid var(--bears-orange); border-radius: 12px; padding: 1.5rem; text-align: center; margin-bottom: 2rem; box-shadow: 0 4px 20px rgba(200,56,3,0.15); }
    .countdown-banner h3 { color: var(--bears-orange); font-size: 1rem; text-transform: uppercase; margin-bottom: 10px; }
    #matchupName { font-size: 1.5rem; font-weight: bold; margin-bottom: 15px; }
    .timer { display: flex; justify-content: center; gap: 15px; font-size: 2rem; font-weight: 900; }
    .timer-box { display: flex; flex-direction: column; align-items: center; }
    .timer-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: normal; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.5rem; }
    .card { background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 1.5rem; }
    .card h2 { font-size: 1.2rem; color: var(--bears-orange); margin-bottom: 1rem; text-transform: uppercase; border-bottom: 1px solid var(--glass-border); padding-bottom: 10px; }

    /* Media/News Styles */
    .news-item { margin-bottom: 1rem; line-height: 1.4; }
    .news-item a { color: #fff; text-decoration: none; font-weight: bold; font-size: 1rem; transition: color 0.2s; }
    .news-item a:hover { color: var(--bears-orange); }
    .video-container { position: relative; padding-bottom: 56.25%; height: 0; margin-bottom: 1rem; border-radius: 8px; overflow: hidden; }
    .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1><span>CW18</span> Daily Hub</h1>
    </header>

    <!-- Matchup & Countdown -->
    <div class="countdown-banner" id="countdownBanner" style="display: none;">
      <h3>Next Matchup</h3>
      <div id="matchupName">Loading...</div>
      <div class="timer" id="timer">
        <div class="timer-box"><span id="days">00</span><span class="timer-label">Days</span></div>:
        <div class="timer-box"><span id="hours">00</span><span class="timer-label">Hours</span></div>:
        <div class="timer-box"><span id="minutes">00</span><span class="timer-label">Mins</span></div>
      </div>
    </div>

    <div class="grid">
      <!-- Latest Videos -->
      <div class="card">
        <h2>📺 Bears Network Live</h2>
        <div id="videoContainer"><p style="color: var(--text-muted);">Loading latest videos...</p></div>
      </div>

      <!-- Matchup News -->
      <div class="card">
        <h2>📰 Breaking News</h2>
        <div id="newsContainer"><p style="color: var(--text-muted);">Scanning for updates...</p></div>
      </div>
    </div>
  </div>

  <script>
    let kickoffTime = null;

    function updateTimer() {
      if (!kickoffTime) return;
      const now = new Date().getTime();
      const distance = kickoffTime - now;

      if (distance < 0) {
        document.getElementById("timer").innerHTML = "<div style='color: var(--bears-orange);'>GAME DAY</div>";
        return;
      }

      const days = Math.floor(distance / (1000 * 60 * 60 * 24));
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));

      document.getElementById("days").innerText = days.toString().padStart(2, '0');
      document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
      document.getElementById("minutes").innerText = minutes.toString().padStart(2, '0');
    }

    async function loadDashboard() {
      try {
        const response = await fetch(`insights.json?t=${new Date().getTime()}`); // Cache buster
        const data = await response.json();

        // 1. Setup Countdown
        if (data.game) {
          document.getElementById('countdownBanner').style.display = 'block';
          document.getElementById('matchupName').innerText = data.game.matchup;
          kickoffTime = new Date(data.game.kickoff).getTime();
          updateTimer();
          setInterval(updateTimer, 60000); // Update timer every minute
        }

        // 2. Load Videos
        const vidDiv = document.getElementById('videoContainer');
        vidDiv.innerHTML = '';
        if (data.videos && data.videos.length > 0) {
          data.videos.forEach(vid => {
            vidDiv.innerHTML += `
              <div style="margin-bottom: 1.5rem;">
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 5px;">${vid.title}</p>
                <div class="video-container">
                  <iframe src="${vid.embed_url}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
              </div>
            `;
          });
        } else {
          vidDiv.innerHTML = '<p>No recent videos found.</p>';
        }

        // 3. Load News
        const newsDiv = document.getElementById('newsContainer');
        newsDiv.innerHTML = '';
        if (data.news && data.news.length > 0) {
          data.news.forEach(item => {
            newsDiv.innerHTML += `
              <div class="news-item">
                <a href="${item.link}" target="_blank">↳ ${item.headline}</a>
              </div>
            `;
          });
        } else {
          newsDiv.innerHTML = '<p style="color: var(--text-muted);">No breaking matchup news at this exact moment. Check the videos!</p>';
        }

      } catch (error) {
        console.error("Dashboard error:", error);
      }
    }

    document.addEventListener('DOMContentLoaded', loadDashboard);
  </script>
</body>
</html>
