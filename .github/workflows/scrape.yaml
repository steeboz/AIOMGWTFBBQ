name: Caleb Williams Pregame Scraper

on:
  schedule:
    # Runs at 14:00 UTC (9:00 AM Central) every Wednesday and Thursday
    - cron: '0 14 * * 3,4'
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
          
      - name: Run Scraper
        run: python scraper.py
        
      - name: Commit and push changes
        run: |
          git config --global user.name "AIOMGWTFBBQ-Bot"
          git config --global user.email "bot@aiomgwtfbbq.com"
          git add insights.json
          git commit -m "Automated update: Pregame insights [skip ci]" || exit 0
          git push